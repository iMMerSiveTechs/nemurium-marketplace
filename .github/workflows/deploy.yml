name: Verify GlassGraph public site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "glassgraph-public-site-validation-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify launch-signup safety
        run: node scripts/verify-glassgraph-launch-signup.mjs
      - name: Verify the Vercel public-site build
        run: node scripts/build-glassgraph-public-site.mjs
